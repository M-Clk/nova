services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=novadb;Username=nova;Password=nova;Include Error Detail=true
      Jwt__Secret: Nova_System_Super_Secret_Key_2026_AtLeast32Chars!
      Jwt__ExpiryMinutes: "15"
    ports:
      - "5000:80"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - api

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: nova
      POSTGRES_PASSWORD: nova
      POSTGRES_DB: novadb
    ports:
      - "5432:5432"
    volumes:
      - nova-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nova -d novadb"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Otomatik arka plan güncellemeleri için Watchtower'ı aktif edebilirsiniz:
  # watchtower:
  #   image: containrrr/watchtower
  #   container_name: watchtower
  #   volumes:
  #     - /var/run/docker.sock:/var/run/docker.sock
  #     # Özel registry kimlik bilgileri için (opsiyonel):
  #     # - ~/.docker/config.json:/config.json
  #   command: --interval 3600 --cleanup --label-enable
  #   restart: unless-stopped

volumes:
  nova-postgres-data:
